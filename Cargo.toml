[package]
name = "any_downloader"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
